[project]
name = "fantasy-football"
version = "0.1.0"
description = "League tooling: Sleeper -> Yahoo migration, scoring diff, FantasyPros projections"
requires-python = ">=3.11"
authors = [{ name = "Michael DeBrey" }]
dependencies = [
    "httpx>=0.27",
    "authlib>=1.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
ff = "ff.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff"]

[tool.ruff]
line-length = 100
src = ["src"]
